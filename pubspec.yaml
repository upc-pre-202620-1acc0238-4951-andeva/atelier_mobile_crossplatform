name: atelier_mobile_crossplatform
description: "App de staff de Atelier para Android e iOS."
publish_to: 'none'
version: 0.5.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  get_it: ^9.3.0
  path_provider: ^2.1.6
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  decimal: ^3.2.6
  intl: ^0.20.3
  uuid: ^4.6.0
  workmanager: ^0.10.10
  connectivity_plus: ^7.3.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  permission_handler: ^13.0.2
  geolocator: ^14.0.1
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  cached_network_image: ^4.0.6
  google_sign_in: ^7.2.0
  universal_ble: ^3.2.0
  flutter_foreground_task: ^11.0.3
  open_filex: ^5.0.0
  share_plus: ^13.3.1
  sqlite3: ^3.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans_regular.ttf
        - asset: assets/fonts/plus_jakarta_sans_medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans_semibold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans_bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans_extrabold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono_medium.ttf
          weight: 500
    - family: AlbertSans
      fonts:
        - asset: assets/fonts/albert_sans_extrabold.ttf
          weight: 800
